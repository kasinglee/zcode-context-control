name: Build Windows and macOS
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create and publish a release after both platforms pass validation
        type: boolean
        default: false
  push:
    branches:
      - 'codex/cross-platform-*'
    tags:
      - 'v*-preview.1'
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/_build-desktop.yml
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: context-manager-*
          path: release
          merge-multiple: true
      - name: Publish one EXE and one DMG after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/publish-release.mjs release
