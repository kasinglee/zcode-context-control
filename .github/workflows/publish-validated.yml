name: Publish validated desktop artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful checks run on main containing both desktop artifacts
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify the source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .status == "completed" and .head_branch == "main" and .path == ".github/workflows/checks.yml" and .head_repository.full_name == $repo' run.json
          echo "sha=$(jq -r .head_sha run.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: context-manager-*
          path: release
          merge-multiple: true
      - name: Publish one EXE and one DMG after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/publish-release.mjs release
